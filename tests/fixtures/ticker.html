<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Ticker</title>
<style>@keyframes spin { to { transform: rotate(360deg); } } #css { width: 20px; height: 20px; animation: spin 1s linear infinite; }</style></head>
<body>
<div id="count">0</div><div id="box" style="position:absolute;left:0;width:10px;height:10px"></div><div id="css"></div>
<script>
  // An interval started before any capture, a requestAnimationFrame loop and a CSS animation.
  let n = 0; setInterval(() => (document.getElementById('count').textContent = ++n), 50);
  let x = 0; const step = () => { document.getElementById('box').style.left = (x = (x + 2) % 500) + 'px'; requestAnimationFrame(step); }; requestAnimationFrame(step);
</script>
</body>
</html>
