<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shader fixture</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #0a0a0a; }
  section { position: relative; height: 100vh; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  h1, h2 { position: relative; margin: 0; padding: 120px 64px 0; font-size: 48px; pointer-events: none; }
</style>
</head>
<body>
<section id="glow"><canvas id="gl"></canvas><h1>A glow follows the pointer</h1></section>
<section id="gpu"><canvas id="wgpu"></canvas><h2>Drawn with WebGPU</h2></section>
<script>
  // WebGL: a full-screen quad whose fragment shader lights up around uMouse.
  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl');
  const compile = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, 'attribute vec2 aPos; void main() { gl_Position = vec4(aPos, 0.0, 1.0); }'));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, [
    'precision mediump float;',
    'uniform vec2 uMouse;',
    'uniform vec2 uResolution;',
    'uniform float uTime;',
    'void main() {',
    '  float d = distance(gl_FragCoord.xy, uMouse);',
    '  float glow = smoothstep(160.0, 0.0, d);',
    '  gl_FragColor = vec4(mix(vec3(0.96, 0.94, 1.0), vec3(0.93, 0.28, 0.6), glow), 1.0);',
    '}',
  ].join('\n')));
  gl.linkProgram(program);
  gl.useProgram(program);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(program, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const uMouse = gl.getUniformLocation(program, 'uMouse');
  const uResolution = gl.getUniformLocation(program, 'uResolution');
  const uTime = gl.getUniformLocation(program, 'uTime');
  let mouse = [-1000, -1000];
  addEventListener('pointermove', (e) => {
    const r = canvas.getBoundingClientRect();
    mouse = [(e.clientX - r.left) * (canvas.width / r.width), (r.bottom - e.clientY) * (canvas.height / r.height)];
  });
  const draw = (t) => {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2fv(uMouse, mouse);
    gl.uniform2f(uResolution, canvas.width, canvas.height);
    gl.uniform1f(uTime, t / 1000);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);

  // WebGPU: one module, configured on the second canvas.
  (async () => {
    const adapter = await navigator.gpu?.requestAdapter();
    const device = await adapter?.requestDevice();
    if (!device) return;
    const code = '@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f { var p = array<vec2f, 3>(vec2f(-1, -1), vec2f(3, -1), vec2f(-1, 3)); return vec4f(p[i], 0, 1); }\n@fragment fn fs() -> @location(0) vec4f { return vec4f(0.2, 0.4, 0.9, 1); }';
    const module = device.createShaderModule({ code });
    const context = document.getElementById('wgpu').getContext('webgpu');
    const format = navigator.gpu.getPreferredCanvasFormat();
    context.configure({ device, format });
    const pipeline = device.createRenderPipeline({ layout: 'auto', vertex: { module, entryPoint: 'vs' }, fragment: { module, entryPoint: 'fs', targets: [{ format }] } });
    const encoder = device.createCommandEncoder();
    const pass = encoder.beginRenderPass({ colorAttachments: [{ view: context.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
    pass.setPipeline(pipeline);
    pass.draw(3);
    pass.end();
    device.queue.submit([encoder.finish()]);
  })();
</script>
</body>
</html>
