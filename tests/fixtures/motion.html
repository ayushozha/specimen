<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion replication fixture</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #1f1d2b; background: #faf7f2; }
  section { position: relative; min-height: 900px; padding: 120px 80px; box-sizing: border-box; overflow: hidden; }
  h1 { font-size: 64px; margin: 0 0 24px; }
  /* Parallax: moved by script, -160px over the first 900px of scroll. */
  #hero .layer { position: absolute; right: 120px; top: 200px; width: 360px; height: 360px; border-radius: 40px; background: #6d5bd0; }
  /* An eased scrub: opacity and scale follow scroll through ease-in-out between 900 and 1800px. */
  #scrub .badge { width: 240px; height: 240px; border-radius: 50%; background: #e88aa8; margin-top: 80px; }
  /* A reveal with a custom bezier. */
  .reveal { opacity: 0; transform: translateY(40px); transition: opacity 700ms cubic-bezier(0.16, 1, 0.3, 1), transform 700ms cubic-bezier(0.16, 1, 0.3, 1); }
  .reveal.in { opacity: 1; transform: none; }
  /* Hover with overshoot. */
  .pop { display: inline-block; padding: 18px 28px; border-radius: 14px; background: #1f1d2b; color: #fff; text-decoration: none; transition: scale 300ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  .pop:hover { scale: 1.08; }
  /* Hover with a spring written as linear(), moving with the translate property. */
  .nudge { display: inline-block; margin-left: 24px; padding: 18px 28px; border-radius: 14px; background: #fff; border: 2px solid #1f1d2b; color: #1f1d2b; text-decoration: none;
    transition: translate 500ms linear(0, 0.2178 2.1%, 1.1144 8.49%, 1.2959 10.7%, 1.3463 11.81%, 1.3705 12.94%, 1.3726, 1.3643 14.48%, 1.3151 16.2%, 1.0317 21.81%, 0.941 24.01%, 0.8912 25.91%, 0.8694 27.84%, 0.8698 29.21%, 0.8824 30.71%, 1.0122 38.33%, 1.0357, 1.046 42.71%, 1.0416 45.7%, 0.9961 53.26%, 0.9839 57.54%, 0.9853 60.71%, 1.0012 68.14%, 1.0056 72.24%, 0.9981 86.66%, 1); }
  .nudge:hover { translate: 16px 0; }
  /* A hover driven by script (no CSS transition to read): the background eases in over 240ms. */
  .scripted { display: inline-block; margin-left: 24px; padding: 18px 28px; border-radius: 14px; color: #1f1d2b; text-decoration: none; background: rgba(109, 91, 208, 0); }
</style>
</head>
<body>
<section id="hero"><h1>Parallax hero</h1><p>The shape drifts up as you scroll.</p><div class="layer"></div></section>
<section id="scrub"><h1>Eased scrub</h1><div class="badge"></div></section>
<section id="reveal"><h1 class="reveal">A reveal with a custom curve</h1><p class="reveal">Fades and rises as it enters.</p></section>
<section id="hover"><h1>Hovers</h1><a class="pop" href="#">Overshoot</a><a class="nudge" href="#">Spring</a><a class="scripted" href="#">Scripted</a></section>
<section id="end"><h1>End</h1></section>
<script>
  const layer = document.querySelector('#hero .layer');
  const badge = document.querySelector('#scrub .badge');
  const ease = (x) => {
    // cubic-bezier(0.42, 0, 0.58, 1) by bisection.
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 40; i++) { const v = 3 * 0.42 * t * (1 - t) ** 2 + 3 * 0.58 * t * t * (1 - t) + t ** 3; if (v < x) lo = t; else hi = t; t = (lo + hi) / 2; }
    return 3 * 0 * t * (1 - t) ** 2 + 3 * 1 * t * t * (1 - t) + t ** 3;
  };
  const update = () => {
    const y = window.scrollY;
    layer.style.transform = `translateY(${-Math.min(900, y) * (160 / 900)}px)`;
    const p = ease(Math.min(1, Math.max(0, (y - 900) / 900)));
    badge.style.opacity = String(0.2 + 0.8 * p);
    badge.style.transform = `scale(${0.6 + 0.4 * p})`;
  };
  addEventListener('scroll', update, { passive: true });
  update();
  // Scripted hover: rAF tween of the background alpha, ease-out cubic, 240ms each way.
  const scripted = document.querySelector('.scripted');
  let alpha = 0, from = 0, to = 0, start = 0, raf = 0;
  const tween = (target) => {
    from = alpha; to = target; start = performance.now(); cancelAnimationFrame(raf);
    const step = (now) => {
      const u = Math.min(1, (now - start) / 240);
      alpha = from + (to - from) * (1 - (1 - u) ** 3);
      scripted.style.background = `rgba(109, 91, 208, ${alpha.toFixed(4)})`;
      if (u < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  };
  scripted.addEventListener('mouseenter', () => tween(0.6));
  scripted.addEventListener('mouseleave', () => tween(0));
  const io = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && e.target.classList.add('in')), { threshold: 0.2 });
  document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
</script>
</body>
</html>
