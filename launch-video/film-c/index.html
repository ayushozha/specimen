<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fffaf5; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="46" data-width="1920" data-height="1080">
      <!-- Scenes: the edge case (pointer ink), why a picture fails, how Specimen records and measures it, where it goes. -->
      <div id="hook" class="clip" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4.5"></div>
      <div id="ink" class="clip" data-composition-id="ink" data-composition-src="compositions/ink.html" data-start="4.5" data-duration="2.7"></div>
      <div id="shot" class="clip" data-composition-id="shot" data-composition-src="compositions/shot.html" data-start="7.2" data-duration="2.2"></div>
      <div id="sweep" class="clip" data-composition-id="sweep" data-composition-src="compositions/sweep.html" data-start="9.4" data-duration="5.6"></div>
      <div id="fade" class="clip" data-composition-id="fade" data-composition-src="compositions/fade.html" data-start="15" data-duration="5"></div>

      <div id="breath" class="clip" data-composition-id="breath" data-composition-src="compositions/breath.html" data-start="37" data-duration="1"></div>
      <div id="payoff" class="clip" data-composition-id="payoff" data-composition-src="compositions/payoff.html" data-start="38" data-duration="4"></div>
      <div id="endcard" class="clip" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="42" data-duration="4"></div>

      <!-- Voice: Eric (ElevenLabs), one file a line. -->
      <audio id="vo01" data-start="0.3" data-duration="3.72" src="assets/voice/L01.mp3"></audio>
      <audio id="vo02" data-start="4.7" data-duration="2.05" src="assets/voice/L02.mp3"></audio>
      <audio id="vo03" data-start="7.4" data-duration="1.44" src="assets/voice/L03.mp3"></audio>

      <audio id="vo06" data-start="20.3" data-duration="2.05" src="assets/voice/L06.mp3"></audio>

      <audio id="vo08" data-start="27.3" data-duration="2.61" src="assets/voice/L08.mp3"></audio>

      <audio id="bed" data-start="0" data-duration="46" data-volume="0.3" data-fade-out="1.5" src="assets/music/bed.wav"></audio>

      <!-- Effects: each starts at its cue minus its own peak. -->

      <audio id="sfx-whoosh-a" data-start="14.96" data-duration="0.31" data-volume="0.5" src="assets/sfx/whoosh-a.wav"></audio>
      <audio id="sfx-tick" data-start="17.3" data-duration="0.07" data-volume="0.6" src="assets/sfx/tick.wav"></audio>

      <audio id="sfx-logo" data-start="41.7" data-duration="0.47" data-volume="0.8" src="assets/sfx/logo.wav"></audio>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
